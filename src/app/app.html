<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-block">
      <a class="brand" routerLink="/tasks" aria-label="Shipyard home"><app-icon name="ship" /><span>Shipyard</span></a>
      <p class="brand-slogan">Plan. Track. Ship.</p>
    </div>
    <div class="topbar-actions">
      <span class="today"><app-icon name="calendar" /> {{ today | date:'EEE, MMM d' }}</span>
      <button class="help-button" type="button" (click)="openHelp()"><app-icon name="help" /> Help</button>
      <label class="theme-select"><span>Theme</span><select aria-label="Theme" [ngModel]="appearance.theme()" (ngModelChange)="appearance.setTheme($event)"><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </div>
  </header>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
  <footer class="app-footer">
    <p class="footer-message">"Good ideas deserve to leave the harbor." - Jacob Stieneker</p>
  </footer>
</div>
<div class="toast-region" role="status" aria-live="polite" aria-atomic="true">
  @if (notice.message()) { <div class="toast"><app-icon name="check" /> {{ notice.message() }} <button type="button" (click)="notice.message.set('')" aria-label="Dismiss notification"><app-icon name="close" /></button></div> }
</div>

@if (helpOpen()) { <app-board-help (closed)="helpOpen.set(false)" /> }
